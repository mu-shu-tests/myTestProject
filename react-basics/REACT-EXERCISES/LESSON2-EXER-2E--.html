<!DOCTYPE html>
<html>
  <head>
    <title>LESSON2 E..</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      // 2e.

      function App() {
        return (
          <>
            <p>Cotton Socks</p>
            <p>Price: $10.90</p>
            <button>Add to Cart</button>
          </>
        );
      }

      // 2f

      function App2() {
        return (
          <>
            <ProductDetails name="Cotton Socks" price="$10.90" />
            <ProductDetails name="Tennis balls" price="$6.00" />
            <ProductDetails name="Plain T-shirt" price="$10.90" />
          </>
        );
      }

      function ProductDetails({ name, price }) {
        return (
          <>
            <p>{name}</p>
            <p>{price}</p>
            <button>Add to Cart</button>
          </>
        );
      }

      // 2g

      function App3() {
        return (
          <>
            <ProductDetails2
              name="Cotton Socks"
              price="$10.90"
              discountPrice="$5.45"
            />

            <ProductDetails2 name="Cotton Socks" price="$10.90" />
          </>
        );
      }

      function ProductDetails2({ name, price, discountPrice }) {
        return (
          <>
            <p>{name}</p>
            <p>Price:{price}</p>
            {discountPrice && <p>Discount Price: {discountPrice}</p>}
            <button>Add to Cart</button>
          </>
        );
      }

      // 2h..............

      function App4() {
        return (
          <>
            <ProductDetails3
              name="Cotton Socks"
              price="$10.90"
              discountPrice="$5.45"
            />

            <ProductDetails3 name="Cotton Socks" price="$10.90" />
          </>
        );
      }

      function ProductDetails3({ name, price, discountPrice }) {
        if (!discountPrice) {
          return (
            <>
              <p>{name}</p>
              <p>Price:{price}</p>
              <button>Add to Cart</button>
            </>
          );
        } else {
          return (
            <>
              <p>{name}</p>
              <del>
                <p>Price:{price}</p>
              </del>
              {discountPrice && <p>Discount Price: {discountPrice}</p>}
              <button>Add to Cart</button>
            </>
          );
        }
      }

      // 2i.................

      function App5() {
        return (
          <>
            <ProductDetails4
              name="Cotton Socks"
              price="$10.90"
              discountPrice="$5.45"
            />

            <ProductDetails4 name="Cotton Socks" price="$20.90" />
          </>
        );
      }

      function ProductDetails4({ name, price, discountPrice }) {
        const checkDiscount = !discountPrice ? (
          <>
            <p>{name}</p>
            <p>Price:{price}</p>
            <button>Add to Cart</button>
          </>
        ) : (
          <>
            <p>{name}</p>
            <del>
              <p>Price:{price}</p>
            </del>
            {discountPrice && <p>Discount Price: {discountPrice}</p>}
            <button>Add to Cart</button>
          </>
        );

        return checkDiscount;
      }

      // 2j............

      function App6() {
        return (
          <>
            <ProductDetails5
              name="Cotton Socks"
              price="$10.90"
              discountPrice="$5.45"
              imageSrc="images/cotton-socks.png"
            />

            <ProductDetails5 name="Cotton Socks" price="$20.90" />
          </>
        );
      }

      function ProductDetails5({ name, price, discountPrice, imageSrc }) {
        const checkDiscount = !discountPrice ? (
          <>
            <img src={imageSrc} alt="" />
            <p>{name}</p>
            <p>Price:{price}</p>
            <button>Add to Cart</button>
          </>
        ) : (
          <>
            <img width="50" src={imageSrc} alt="" />
            <p>{name}</p>
            <del>
              <p>Price:{price}</p>
            </del>
            {discountPrice && <p>Discount Price: {discountPrice}</p>}
            <button>Add to Cart</button>
          </>
        );

        return checkDiscount;
      }

      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);
      root.render(<App6 />);
    </script>
  </body>
</html>
