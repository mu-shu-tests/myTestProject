<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORMAT MONEY</title>
</head>
<body>
  <script>
   function formatCurrency(moneyAmount) {
  if (moneyAmount >= 0) {
    return `$${(moneyAmount / 100).toFixed(2)}`;
  } else if (moneyAmount < 0) {
    return `-$${(-moneyAmount / 100).toFixed(2)}`;
  }
}

const result = formatCurrency(0);
console.log(result);


  </script>
</body>
</html>
