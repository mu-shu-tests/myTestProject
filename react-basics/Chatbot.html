<!doctype html>

      body {

      }
      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        margin-left: 10px;
        cursor: pointer;
        font-size: 15px;
      }
      .chat-input {
        padding: 10px 15px;
        font-size: 15px;
        border-radius: 10px;
        border-width: 1px;
        flex-grow: 1;
      }
      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }
      .app-container {
        margin-left: auto;
        margin-right: auto;
        max-width: 600px;

        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;
      }
      .chat-message-robot {
        display: flex;
        align-items: start;
      }
      .chat-messages {
        background-color: rgb(238, 238, 238);
        padding: 12px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 15px;
        margin-bottom: 20px;
        max-width: 300px;
      }
      .chat-messages-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
      img {
        width: 45px;
      }

      .welcome-para {
        text-align: center;
        color: gray;
      }

      function ChatInput({ chatMessages, setChatMessage }) {
        const [inputText, setInputText] = React.useState("");
        const [isLoading, setIsLoading] = React.useState();

        const newChatMessages = [
          ...chatMessages,
          {
            message: inputText,
            sender: "user",
            id: crypto.randomUUID(),
          },
        ];

        function noSendMessage() {
          console.log("message can't be sent!");
        }

        async function sendMessage() {
          setChatMessage(newChatMessages);

          setInputText("");
          setIsLoading(!response);

          if (!isLoading === true) {
            console.log("true");
          } else {
            console.log("false");
          }

          // console.log(!response);
          // console.log(!isLoading);

          /*
                   if (!response) {

                    ...newChatMessages,
                    {
                      message: "Loading...",
                      sender: "robot",
                      id: crypto.randomUUID,
                    },
                  ]);
                }
                */
          if (!response) {
            setChatMessage([
              ...newChatMessages,
              {
                message: (
                  <img
                    className="loading-spinner-img"
                    src="images/loading-spinner.gif"
                  />
                ),
                sender: "robot",
                id: crypto.randomUUID,
              },
            ]);
          }

          const response = await Chatbot.getResponseAsync(inputText);
          //console.log(response);

          setChatMessage([
            ...newChatMessages,
            {
              message: response,
              sender: "robot",
              id: crypto.randomUUID(),
            },
          ]);
        }

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function sendMessageEnter(event) {
          if (event.key === "Enter") {
            sendMessage();
          } else if (event.key === "Escape") {
            setInputText("");
          }
        }
        return (
          <div className="chat-input-container">
            <input
              className="chat-input"
              onChange={saveInputText}
              onKeyDown={sendMessageEnter}
              type="text"
              placeholder="Send a message to a Chatbot"
              size="30"
              value={inputText}
            />
            <button
              className="send-button"
              onClick={inputText === "" ? noSendMessage : sendMessage}
            >
              Send
            </button>
          </div>
        );
      }

      function useAutoScroll(dependencies) {
        const chatMessageRef = React.useRef(null);
        React.useEffect(() => {
          // console.log(chatMessageRef.current);
          // console.log('updated');
          const chatMessageElm = chatMessageRef.current;
          if (chatMessageElm) {
            chatMessageElm.scrollTop = chatMessageElm.scrollHeight;
          }
        }, [dependencies]);
        return chatMessageRef;
      }
